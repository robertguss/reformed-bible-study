packages:
  - "packages/*"
  - "apps/*"

# Exact pins for the whole workspace. Upgrades are deliberate pull requests.
catalog:
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  alchemy: 2.0.0-beta.85
  "@effect/platform-node": 4.1.2
  "@cloudflare/workers-types": 5.20261030.1
  "@effect/platform-browser": 4.1.2
  "@foldkit/devtools": 0.170.0
  "@foldkit/oxlint-plugin": 0.15.4
  "@foldkit/ui": 0.170.0
  "@foldkit/vite-plugin": 0.29.0
  foldkit: 0.170.0
  vite: 8.3.5
  fast-xml-parser: 5.11.2
  fflate: 0.8.3
  bible-passage-reference-parser: 4.0.0
  "@types/node": 24.19.2
  "@effect/tsgo": 0.64.1
  "@effect/vitest": 4.1.2
  effect: 4.1.2
  oxfmt: 0.75.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  typescript: 7.0.2
  vitest: 5.1.0

# Refuse packages published less than three days ago (minutes).
minimumReleaseAge: 4320
# Exact-version exceptions for pins newer than three days. Remove each entry
# once it is older than the window; all of these expire on 2026-11-06.
minimumReleaseAgeExclude:
  - "@effect/platform-browser@4.1.2"
  - "@effect/tsgo-darwin-arm64@0.64.1"
  - "@effect/tsgo-darwin-x64@0.64.1"
  - "@effect/tsgo-linux-arm64@0.64.1"
  - "@effect/tsgo-linux-arm@0.64.1"
  - "@effect/tsgo-linux-x64@0.64.1"
  - "@effect/tsgo-win32-arm64@0.64.1"
  - "@effect/tsgo-win32-x64@0.64.1"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - effect@4.1.2
  - "@effect/vitest@4.1.2"
  - "@effect/tsgo@0.64.1"
  - vitest@5.1.0
  - alchemy@2.0.0-beta.85
  - "@alchemy.run/cloudflare@2.0.0-beta.85"
  - "@effect/platform-node@4.1.2"
  - "@alchemy.run/acme@2.0.0-beta.85"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.85"
  - "@alchemy.run/docker@2.0.0-beta.85"
  - "@alchemy.run/node-utils@2.0.0-beta.85"
  - "@alchemy.run/sql@2.0.0-beta.85"
  - "@distilled.cloud/acme@1.0.0-rc.18"
  - "@distilled.cloud/aws4signer@1.0.0-rc.18"
  - "@distilled.cloud/aws@1.0.0-rc.18"
  - "@distilled.cloud/cloudflare@1.0.0-rc.18"
  - "@distilled.cloud/core@1.0.0-rc.18"
  - "@distilled.cloud/iceberg@1.0.0-rc.18"
  - "@effect/platform-node-shared@4.1.2"

# Dependency install scripts stay off unless a package is named here.
onlyBuiltDependencies: []
# workerd's install script fetches the local Workers runtime for `alchemy dev`; deploys do not need it.
allowBuilds:
  workerd: false
