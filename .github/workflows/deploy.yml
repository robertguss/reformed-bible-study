name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the locked dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(node -p "require('./dataset/release.lock.json').release")
          archive=$(node -p "require('./dataset/release.lock.json').archive")
          gh release download "dataset-$release" --pattern "$archive" --dir dist/release
      - run: pnpm dataset:from-archive
      - run: pnpm --filter @reformed-bible/web build
      - run: pnpm deploy:assemble --stage production
      - run: pnpm --filter @reformed-bible/infra exec alchemy deploy --stage production --no-input --yes
      - run: pnpm deploy:smoke --stage production
